<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a1622"/>
      <stop offset="60%" stop-color="#0e0a14"/>
      <stop offset="100%" stop-color="#030205"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7849"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 120, 73, 0.6)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#strokeGrad)" stroke-width="3"/>

  <!-- Subtle ambient halo -->
  <circle cx="256" cy="230" r="140" fill="#ff5722" opacity="0.12" filter="url(#glow)"/>

  <!-- Monogram Logo "CL" -->
  <g font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" text-anchor="middle">
    <!-- Letter C -->
    <text x="210" y="300" font-size="190" fill="#ffffff" letter-spacing="-6">C</text>
    <!-- Letter L with accent glow -->
    <text x="315" y="300" font-size="190" fill="url(#accentGrad)" letter-spacing="-6">L</text>
  </g>

  <!-- Sparkle Accent ✦ -->
  <path d="M375 160 L382 178 L400 185 L382 192 L375 210 L368 192 L350 185 L368 178 Z" fill="#ff7849" filter="url(#glow)"/>
</svg>
